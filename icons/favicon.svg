<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid deep navy backdrop with gentle squircle rounding -->
  <rect width="512" height="512" rx="112" fill="#0B132B"/>

  <!-- Subtle inner ambient rim -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>

  <!-- Geometric Monogram: LP (LayarPro) + Screen Viewfinder + Record Dot + Doodle Stroke -->
  <g transform="translate(136, 120)">
    <!-- Bottom Doodle Brush Stroke (The 'L' base) -->
    <rect x="0" y="224" width="240" height="48" rx="24" fill="#818CF8"/>
    
    <!-- Stylus tip accent -->
    <circle cx="216" cy="248" r="14" fill="#38BDF8"/>

    <!-- Primary Vertical Stem (The 'L' & 'P' spine) -->
    <rect x="0" y="0" width="48" height="272" rx="24" fill="#6366F1"/>

    <!-- Top Bar of 'P' (Screen Viewfinder Header) -->
    <rect x="0" y="0" width="180" height="48" rx="24" fill="#6366F1"/>

    <!-- Right Curve / Arm of 'P' (Viewport Aperture) -->
    <rect x="132" y="0" width="48" height="152" rx="24" fill="#38BDF8"/>

    <!-- Middle Bar of 'P' (Center Divider) -->
    <rect x="0" y="104" width="180" height="48" rx="24" fill="#38BDF8"/>

    <!-- Focal Record Dot (The core recording aperture) -->
    <circle cx="90" cy="76" r="22" fill="#F43F5E"/>
    <!-- Subtle specular core -->
    <circle cx="90" cy="76" r="9" fill="#FECDD3"/>
  </g>
</svg>
