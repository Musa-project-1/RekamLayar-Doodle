<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid deep navy backdrop with gentle squircle rounding -->
  <rect width="512" height="512" rx="112" fill="#0B132B"/>

  <!-- Subtle inner ambient rim -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>

  <!-- Geometric Monogram: R (Reka: Rekam & Karya + Screen Viewfinder + Record Dot + Doodle Stroke) -->
  <g transform="translate(144, 120)">
    <!-- Diagonal Leg of 'R' (Dynamic Stylus / Doodle Brush Stroke) -->
    <line x1="98" y1="136" x2="196" y2="248" stroke="#818CF8" stroke-width="48" stroke-linecap="round"/>
    
    <!-- Stylus tip accent -->
    <circle cx="196" cy="248" r="14" fill="#38BDF8"/>

    <!-- Primary Vertical Stem of 'R' (Viewfinder frame & 'R' spine) -->
    <rect x="0" y="0" width="48" height="272" rx="24" fill="#6366F1"/>

    <!-- Top Bar of 'R' -->
    <rect x="0" y="0" width="172" height="48" rx="24" fill="#6366F1"/>

    <!-- Right Loop Curve of 'R' -->
    <rect x="124" y="0" width="48" height="152" rx="24" fill="#38BDF8"/>

    <!-- Middle Bar of 'R' -->
    <rect x="0" y="104" width="172" height="48" rx="24" fill="#38BDF8"/>

    <!-- Focal Record Dot (The core recording aperture) -->
    <circle cx="86" cy="76" r="22" fill="#F43F5E"/>
    <!-- Specular core -->
    <circle cx="86" cy="76" r="9" fill="#FECDD3"/>
  </g>
</svg>
