<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9"/>
      <stop offset="55%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Screen / monitor frame -->
  <rect x="112" y="140" width="288" height="196" rx="20" fill="url(#screen)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"/>

  <!-- Screen corners (bracket accents) -->
  <path d="M112 184 v-24 q0 -20 20 -20 h24" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
  <path d="M400 184 v-24 q0 -20 -20 -20 h-24" fill="none" stroke="#A78BFA" stroke-width="10" stroke-linecap="round"/>
  <path d="M112 328 v24 q0 20 20 20 h24" fill="none" stroke="#A78BFA" stroke-width="10" stroke-linecap="round"/>
  <path d="M400 328 v24 q0 20 -20 20 h-24" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>

  <!-- Recording dot -->
  <circle cx="256" cy="238" r="34" fill="#EF4444"/>
  <circle cx="256" cy="238" r="34" fill="#EF4444" opacity="0.35">
    <animate attributeName="r" values="34;48;34" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0;0.35" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Monitor stand -->
  <rect x="232" y="336" width="48" height="20" rx="6" fill="#FFFFFF" fill-opacity="0.25"/>
  <rect x="196" y="356" width="120" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.25"/>
</svg>
