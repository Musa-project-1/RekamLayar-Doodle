<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid deep obsidian backdrop with gentle squircle rounding -->
  <rect width="512" height="512" rx="112" fill="#0D1117"/>

  <!-- Subtle inner ambient rim -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="4"/>

  <!-- Geometric Monogram: R (Reka: Cinema Tangerine + Amber Gold + Tally Record Dot) -->
  <g transform="translate(144, 120)">
    <!-- Diagonal Leg of 'R' (Doodle Brush Stroke: Golden Amber) -->
    <line x1="98" y1="136" x2="196" y2="248" stroke="#FBBF24" stroke-width="48" stroke-linecap="round"/>
    
    <!-- Stylus tip accent -->
    <circle cx="196" cy="248" r="14" fill="#FFFBEB"/>

    <!-- Primary Vertical Stem of 'R' (Viewfinder Frame: Cinema Tangerine) -->
    <rect x="0" y="0" width="48" height="272" rx="24" fill="#F97316"/>

    <!-- Top Bar of 'R' -->
    <rect x="0" y="0" width="172" height="48" rx="24" fill="#F97316"/>

    <!-- Right Loop Curve of 'R' (Orange 400) -->
    <rect x="124" y="0" width="48" height="152" rx="24" fill="#FB923C"/>

    <!-- Middle Bar of 'R' -->
    <rect x="0" y="104" width="172" height="48" rx="24" fill="#FB923C"/>

    <!-- Tally Record Dot (Crimson with specular core) -->
    <circle cx="86" cy="76" r="22" fill="#EF4444"/>
    <circle cx="86" cy="76" r="9" fill="#FEE2E2"/>
  </g>
</svg>
